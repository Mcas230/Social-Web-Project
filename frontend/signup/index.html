<!DOCTYPE html>
<html lang="es">

    <head>
        <link rel="stylesheet" href="styles.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="scripts.js" defer></script>
    </head>
    
    <body>

        <a href="../login/index.html" class="returnButton">
            <svg class="lucide lucide-arrow-left"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">

                <path d="m12 19-7-7 7-7"/>
                <path d="M19 12H5"/>

            </svg>
        </a>
        <h1>Registrate</h1>

        <div class="signUpForm">

            <div class="inputGroup">
                <p>Nombre Completo</p>
                <input 
                    required
                    type="text"
                    id="signNickname"
                    name="apodo"
                    placeholder="Nombre Completo">
            </div>

            <div class="inputGroup">
                <p>Nombre de usuario</p>
                <input 
                    required
                    type="text"
                    id="signUser"
                    name="usuario"
                    placeholder="Nombre de Usuario">                
            </div>

            <div class="inputGroup">
                <p>Correo electronico</p>
                <input
                    required
                    type="email"
                    id="signEmail"
                    name="email"
                    placeholder="Correo electronico">
            </div>
            
            <div class="inputGroup">
                <p>Contraseña</p>
                <input 
                    required
                    type="password"
                    id="signPassword"
                    name="password"
                    placeholder="Por lo menos 8 caracteres">
            </div>

            <button id="signUpButton">registrarse</button>
        </div>

        <footer>
            <small>2026: electricos corporation</small>
        </footer>
    </body>
</html>
