<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="styles.css">

    <script src="scripts.js" defer></script>
</head>


<body>

    <header>
        <div class="logo">
            <a href="index.html"><h2>Instacraft</h2></a>
        </div>

        <form class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar">
        </form>
            
        <nav class="icons" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i></a></li>
                <li><a href="mensajes.html"><i class="fa-solid fa-paper-plane"></i></a></li>
                <li><a href="explorar.html"><i class="fa-solid fa-compass"></i></a></li>
                <li><a href="notificaciones.html"><i class="fa-solid fa-heart"></i></a></li>
            </ul>
        </nav>

    </header>

    <div class="profileInfo">

        <img class="profilePhoto" src="default-profile.png" alt="Foto de perfil">

        <div class="profileData">

            <div class="profileActions">
                <h1 class = "profileUsername"></h1>
                <button class="followButton">follow</button>
            </div>

            <div class="profileStats">
                <span>posts</span>
                <span>followers</span>
                <span>following</span>
            </div>

            <h2 class="User">nombre</h2>

            <div class="profileDescription">
                <span></span>
            </div>

        </div>

    </div>

    <main>
        <div class="posts"></div>
    </main>


    <div class="modal">

        <div class="modalContent">

            <button class="closeModal">X</button>

            <img src="warioman.png" alt="">

            <div class="postInfo">

                <div class="postHeader">
                    <h3>Nombre</h3>
                </div>

                <div class="postDescription">
                    <p>wario foto toto.</p>
                </div>

                <div class="postComments">
                    <p>traxfrax200: hola</p>
                    <p>noobmaster69: tremenda foto</p>
                    <p>tungtungsahur007: xd</p>
                </div>

            </div>

        </div>

    </div>


    <footer>

        <p class="groupName">electricos corporation</p>

    </footer>

</body>
</html>
