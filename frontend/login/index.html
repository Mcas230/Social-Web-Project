<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="styles.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="scripts.js" defer></script>
    </head>
    
    <body>

        <div class="loginContainer">

            <div class="loginImage">
                <img src="gato.jpg" alt="imagen de login">
            </div>

            <div class="loginForm">

                <h1>Iniciar Sesión</h1>

                <div class="logginInput">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="Correo electrónico"/>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Contraseña"/>

                    <button type="button">Iniciar sesión</button>
                    <a href="../signup/index.html" id="signUp">crear una cuenta</a>

                </div>
            </div>
        </div>

        <footer>
            <small>2026: electricos corporation</small>
        </footer>
    </body>
</html>
